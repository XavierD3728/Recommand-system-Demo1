<!DOCTYPE html>
<html>
<head>
    <title>推荐系统可视化</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { margin-top: 30px; }
        .card { margin-bottom: 20px; }
        #rulesTable { font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">商品推荐系统</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        获取推荐
                    </div>
                    <div class="card-body">
                        <form id="recommendationForm">
                            <div class="mb-3">
                                <label for="user_id" class="form-label">选择用户</label>
                                <select class="form-select" id="user_id" name="user_id">
                                    {% for user in users %}
                                    <option value="{{ user }}">用户 {{ user }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="n_recommendations" class="form-label">推荐数量</label>
                                <input type="number" class="form-control" id="n_recommendations" name="n_recommendations" value="3" min="1" max="10">
                            </div>
                            <button type="submit" class="btn btn-primary">获取推荐</button>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        推荐结果
                    </div>
                    <div class="card-body">
                        <h6>历史购买记录：</h6>
                        <ul id="userHistory" class="list-group mb-3">
                        </ul>
                        <h6>推荐商品：</h6>
                        <ul id="recommendations" class="list-group">
                        </ul>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        关联规则分析
                    </div>
                    <div class="card-body">
                        <div class="accordion" id="rulesAccordion">
                            <!-- 规则将通过JavaScript动态添加到这里 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mt-3">
            <div class="card-header">
                数据管理
            </div>
            <div class="card-body">
                <form id="uploadForm" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="dataFile" class="form-label">上传新数据（CSV格式）</label>
                        <input type="file" class="form-control" id="dataFile" accept=".csv">
                    </div>
                    <button type="submit" class="btn btn-primary">更新数据</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function refreshData() {
            // 刷新关联规则
            $.get('/view_rules', function(data) {
                const accordion = $('#rulesAccordion');
                accordion.empty(); // 清空现有规则
                
                // 遍历每个类别的规则
                Object.entries(data).forEach(([category, rules], index) => {
                    const categoryId = `category-${index}`;
                    
                    // 创建折叠面板
                    const categoryHtml = `
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button ${index === 0 ? '' : 'collapsed'}" 
                                        type="button" 
                                        data-bs-toggle="collapse" 
                                        data-bs-target="#${categoryId}">
                                    ${category} (${rules.length}条规则)
                                </button>
                            </h2>
                            <div id="${categoryId}" 
                                 class="accordion-collapse collapse ${index === 0 ? 'show' : ''}"
                                 data-bs-parent="#rulesAccordion">
                                <div class="accordion-body">
                                    <table class="table table-sm">
                                        <thead>
                                            <tr>
                                                <th>如果购买</th>
                                                <th>则可能购买</th>
                                                <th>置信度</th>
                                                <th>支持度</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${rules.map(rule => `
                                                <tr>
                                                    <td>${rule.antecedents.join('、')}</td>
                                                    <td>${rule.consequents.join('、')}</td>
                                                    <td>${(rule.confidence * 100).toFixed(1)}%</td>
                                                    <td>${(rule.support * 100).toFixed(1)}%</td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    accordion.append(categoryHtml);
                });
            });

            // 刷新用户列表和商品列表
            $.get('/get_lists', function(data) {
                // 更新用户选择列表
                const userSelect = $('#user_id');
                userSelect.empty();
                data.users.forEach(user => {
                    userSelect.append(`<option value="${user}">用户 ${user}</option>`);
                });

                // 更新商品类别表格
                const categoryTable = $('#categoryTable tbody');
                categoryTable.empty();
                Object.entries(data.categories).forEach(([item, category]) => {
                    categoryTable.append(`
                        <tr>
                            <td>${item}</td>
                            <td>${category}</td>
                            <td>
                                <select class="form-select category-select" data-item="${item}">
                                    ${data.all_categories.map(cat => `
                                        <option value="${cat}" ${cat === category ? 'selected' : ''}>
                                            ${cat}
                                        </option>
                                    `).join('')}
                                    <option value="新类别">+ 添加新类别</option>
                                </select>
                            </td>
                        </tr>
                    `);
                });
            });
        }

        $(document).ready(function() {
            // 加载关联规则
            refreshData();

            // 处理表单提交
            $('#recommendationForm').submit(function(e) {
                e.preventDefault();
                $.post('/get_recommendations', $(this).serialize(), function(data) {
                    // 显示历史购买记录
                    $('#userHistory').empty();
                    data.user_history.forEach(item => {
                        $('#userHistory').append(`
                            <li class="list-group-item">${item}</li>
                        `);
                    });

                    // 显示推荐商品
                    $('#recommendations').empty();
                    data.recommendations.forEach(item => {
                        $('#recommendations').append(`
                            <li class="list-group-item">${item}</li>
                        `);
                    });
                });
            });

            // 修改文件上传处理
            $('#uploadForm').submit(function(e) {
                e.preventDefault();
                var formData = new FormData();
                formData.append('file', $('#dataFile')[0].files[0]);
                
                $.ajax({
                    url: '/update_data',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(response) {
                        if (response.new_items && response.new_items.length > 0) {
                            alert(`发现新商品：${response.new_items.join(', ')}\n这些商品已被临时归类为"未分类"，请在类别管理中更新它们的类别。`);
                        }
                        refreshData(); // 刷新页面数据而不是重载整个页面
                        alert('数据更新成功！');
                    },
                    error: function(xhr) {
                        alert('更新失败: ' + xhr.responseJSON.error);
                    }
                });
            });

            // 处理类别更新
            $(document).on('change', '.category-select', function() {
                const item_id = $(this).data('item');
                let new_category = $(this).val();
                
                if (new_category === '新类别') {
                    new_category = prompt('请输入新的类别名称：');
                    if (!new_category) {
                        $(this).val($(this).find('option:selected').prev().val());
                        return;
                    }
                }
                
                $.ajax({
                    url: '/update_category',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        item_id: item_id,
                        category: new_category
                    }),
                    success: function(response) {
                        refreshData(); // 刷新页面数据
                        alert('类别更新成功！');
                    },
                    error: function(xhr) {
                        alert('更新失败: ' + xhr.responseJSON.error);
                    }
                });
            });
        });
    </script>
</body>
</html>
