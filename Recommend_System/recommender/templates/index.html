<!DOCTYPE html>
<html>
<head>
    <title>推荐系统可视化</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { margin-top: 30px; }
        .card { margin-bottom: 20px; }
        #rulesTable { font-size: 14px; }
        .category-select { max-width: 200px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">商品推荐系统</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        获取推荐
                    </div>
                    <div class="card-body">
                        <form id="recommend-form">
                            <div class="mb-3">
                                <label for="user-id" class="form-label">选择用户</label>
                                <select class="form-select" id="user-id" name="user-id">
                                    {% for user in users %}
                                    <option value="{{ user }}">用户 {{ user }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="n-recommendations" class="form-label">推荐数量</label>
                                <input type="number" class="form-control" id="n-recommendations" name="n-recommendations" value="5" min="1" max="10">
                            </div>
                            <button type="submit" class="btn btn-primary">获取推荐</button>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        推荐结果
                    </div>
                    <div class="card-body">
                        <div>
                            <h6>历史购买记录：</h6>
                            <div id="user-history" class="list-group mb-3">
                            </div>
                        </div>
                        <div>
                            <h6>推荐商品：</h6>
                            <div id="recommendations" class="list-group">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        关联规则分析
                    </div>
                    <div class="card-body">
                        <div class="accordion" id="rulesAccordion">
                            <!-- 规则将通过JavaScript动态添加到这里 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mt-3">
            <div class="card-header d-flex justify-content-between align-items-center">
                数据管理
                <a href="/view_data" target="_blank" class="btn btn-info btn-sm">查看数据表</a>
            </div>
            <div class="card-body">
                <form id="uploadForm" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="dataFile" class="form-label">上传新数据（CSV格式）</label>
                        <input type="file" class="form-control" id="dataFile" accept=".csv">
                    </div>
                    <button type="submit" class="btn btn-primary">更新数据</button>
                </form>
            </div>
        </div>

        <div class="card mt-3">
            <div class="card-header">
                商品类别管理
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped" id="categoryTable">
                        <thead>
                            <tr>
                                <th>商品</th>
                                <th>当前类别</th>
                                <th>修改类别</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for item, category in product_categories.items() %}
                            <tr>
                                <td>{{ item }}</td>
                                <td>{{ category }}</td>
                                <td>
                                    <select class="form-select category-select" data-item="{{ item }}">
                                        {% for cat in categories %}
                                        <option value="{{ cat }}" {% if cat == category %}selected{% endif %}>
                                            {{ cat }}
                                        </option>
                                        {% endfor %}
                                        <option value="新类别">+ 添加新类别</option>
                                    </select>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function refreshData() {
            // 刷新关联规则
            $.get('/view_rules', function(data) {
                const accordion = $('#rulesAccordion');
                accordion.empty();
                
                Object.entries(data).forEach(([category, rules], index) => {
                    const categoryId = `category-${index}`;
                    const categoryHtml = `
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button ${index === 0 ? '' : 'collapsed'}" 
                                        type="button" 
                                        data-bs-toggle="collapse" 
                                        data-bs-target="#${categoryId}">
                                    ${category} (${rules.length}条规则)
                                </button>
                            </h2>
                            <div id="${categoryId}" 
                                 class="accordion-collapse collapse ${index === 0 ? 'show' : ''}"
                                 data-bs-parent="#rulesAccordion">
                                <div class="accordion-body">
                                    <table class="table table-sm">
                                        <thead>
                                            <tr>
                                                <th>商品级规则</th>
                                                <th>类别级规则</th>
                                                <th>置信度</th>
                                                <th>支持度</th>
                                                <th>提升度</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${rules.map(rule => `
                                                <tr>
                                                    <td>${rule.description.item_level}</td>
                                                    <td>${rule.description.category_level}</td>
                                                    <td>${(rule.confidence * 100).toFixed(1)}%</td>
                                                    <td>${(rule.support * 100).toFixed(1)}%</td>
                                                    <td>${rule.lift.toFixed(2)}</td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    `;
                    accordion.append(categoryHtml);
                });
            });

            // 刷新类别表格
            $.get('/get_lists', function(data) {
                const categoryTable = $('#categoryTable tbody');
                categoryTable.empty();
                
                Object.entries(data.categories).forEach(([item, category]) => {
                    categoryTable.append(`
                        <tr>
                            <td>${item}</td>
                            <td>${category}</td>
                            <td>
                                <select class="form-select category-select" data-item="${item}">
                                    ${data.all_categories.map(cat => `
                                        <option value="${cat}" ${cat === category ? 'selected' : ''}>
                                            ${cat}
                                        </option>
                                    `).join('')}
                                    <option value="新类别">+ 添加新类别</option>
                                </select>
                            </td>
                        </tr>
                    `);
                });
            });
        }

        $(document).ready(function() {
            // 初始化页面数据
            refreshData();

            // 处理推荐表单提交
            $('#recommend-form').submit(function(e) {
                e.preventDefault();
                const userId = $('#user-id').val();
                const nRecommendations = $('#n-recommendations').val();
                
                $.ajax({
                    url: '/get_recommendations',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ 
                        user_id: userId,
                        n_recommendations: nRecommendations
                    }),
                    success: function(response) {
                        $('#user-history').empty();
                        $('#recommendations').empty();
                        
                        response.user_history.forEach(function(item) {
                            $('#user-history').append(
                                `<div class="list-group-item">${item}</div>`
                            );
                        });
                        
                        response.recommendations.forEach(function(rec) {
                            $('#recommendations').append(
                                `<div class="list-group-item">
                                    ${rec.item_id} 
                                    <br>
                                    <small class="text-muted">
                                        置信度: ${(rec.confidence * 100).toFixed(1)}%, 
                                        支持度: ${(rec.support * 100).toFixed(1)}%, 
                                        提升度: ${rec.lift.toFixed(2)}
                                    </small>
                                </div>`
                            );
                        });
                    },
                    error: function(error) {
                        alert('获取推荐失败: ' + (error.responseJSON ? error.responseJSON.error : '未知错误'));
                    }
                });
            });

            // 处理文件上传
            $('#uploadForm').submit(function(e) {
                e.preventDefault();
                var formData = new FormData();
                formData.append('file', $('#dataFile')[0].files[0]);
                
                $.ajax({
                    url: '/update_data',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(response) {
                        if (response.new_items && response.new_items.length > 0) {
                            alert(`发现新商品：${response.new_items.join(', ')}\n这些商品已被临时归类为"未分类"，请在类别管理中更新它们的类别。`);
                        }
                        refreshData();
                        alert('数据更新成功！');
                    },
                    error: function(xhr) {
                        alert('更新失败: ' + xhr.responseJSON.error);
                    }
                });
            });

            // 处理类别更新
            $(document).on('change', '.category-select', function() {
                const item_id = $(this).data('item');
                let new_category = $(this).val();
                
                if (new_category === '新类别') {
                    new_category = prompt('请输入新的类别名称：');
                    if (!new_category) {
                        $(this).val($(this).find('option:selected').prev().val());
                        return;
                    }
                }
                
                $.ajax({
                    url: '/update_category',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        item_id: item_id,
                        category: new_category
                    }),
                    success: function(response) {
                        refreshData();
                        alert('类别更新成功！');
                    },
                    error: function(xhr) {
                        alert('更新失败: ' + xhr.responseJSON.error);
                    }
                });
            });
        });
    </script>
</body>
</html>
